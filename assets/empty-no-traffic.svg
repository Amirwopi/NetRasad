<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1F26"/>
      <stop offset="100%" stop-color="#12151B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 60 H400 M0 120 H400 M0 180 H400 M0 240 H400" stroke="#262D38" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M80 0 V300 M160 0 V300 M240 0 V300 M320 0 V300" stroke="#262D38" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Router Body -->
  <g transform="translate(110, 140)">
    <!-- Antennas -->
    <line x1="30" y1="20" x2="30" y2="-25" stroke="#5A6471" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="20" x2="90" y2="-35" stroke="#5A6471" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="20" x2="150" y2="-25" stroke="#5A6471" stroke-width="4" stroke-linecap="round"/>
    
    <circle cx="30" cy="-25" r="4" fill="#00D4FF"/>
    <circle cx="90" cy="-35" r="4" fill="#5A6471"/>
    <circle cx="150" cy="-25" r="4" fill="#00D4FF"/>

    <!-- Main Router Box -->
    <rect x="0" y="20" width="180" height="50" rx="10" fill="#262E3B" stroke="#3A4451" stroke-width="2"/>
    
    <!-- LED Indicators -->
    <circle cx="30" cy="45" r="4" fill="#3A4451"/>
    <circle cx="50" cy="45" r="4" fill="#3A4451"/>
    <circle cx="70" cy="45" r="4" fill="#3A4451"/>
    
    <!-- Flatline Display Window -->
    <rect x="95" y="35" width="65" height="20" rx="4" fill="#1B1F26" stroke="#3A4451" stroke-width="1.5"/>
    <!-- Flatline signal -->
    <path d="M100 45 H120 L125 45 L130 45 H155" stroke="#5A6471" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Floating 'Z z z' Sleep elements -->
  <text x="280" y="110" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="22" fill="#00D4FF" opacity="0.9">Z</text>
  <text x="302" y="92" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="16" fill="#5A6471" opacity="0.7">z</text>
  <text x="318" y="78" font-family="Segoe UI, sans-serif" font-weight="bold" font-size="12" fill="#3A4451" opacity="0.5">z</text>

  <!-- Subtitle Text -->
  <text x="200" y="235" font-family="Segoe UI, sans-serif" font-weight="600" font-size="16" fill="#8A93A5" text-anchor="middle">No Traffic Data Detected</text>
  <text x="200" y="258" font-family="Segoe UI, sans-serif" font-size="13" fill="#5A6471" text-anchor="middle">Waiting for network activity on monitored interfaces...</text>
</svg>
