name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI
        shell: bash
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.Version=$env:VERSION"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/bin/NetRasad.exe
          if-no-files-found: error

  linux:
    # Building on the oldest supported Ubuntu keeps the binary's glibc
    # requirement at 2.35, so it also runs on Ubuntu 22.04 and Debian 12.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Wails CLI and nfpm
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build and package
        run: ./scripts/build.sh "$VERSION" --package

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/dist/*
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: NetRasad ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
