<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (R + Signal Motif) -->
  <g transform="translate(8, 6)">
    <!-- Outer Signal Arc -->
    <path d="M 10 38 A 22 22 0 0 1 38 10" fill="none" stroke="url(#logoGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <!-- Inner Signal Arc -->
    <path d="M 16 38 A 15 15 0 0 1 38 16" fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Stylized 'R' Stem and Loop -->
    <path d="M 18 14 V 40" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 18 16 H 32 C 38 16, 40 22, 34 27 C 30 30, 24 28, 18 28" fill="none" stroke="url(#logoGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 26 27 L 38 40" stroke="url(#logoGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Signal Pulse Dot -->
    <circle cx="38" cy="10" r="3" fill="#00FF88"/>
  </g>

  <!-- Brand Text -->
  <text x="68" y="36" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="24" fill="url(#textGrad)" letter-spacing="0.5">Net<tspan fill="#00D4FF">Rasad</tspan></text>
  <text x="69" y="48" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="500" font-size="9" fill="#8A93A5" letter-spacing="1.5">NETWORK MONITOR</text>
</svg>
